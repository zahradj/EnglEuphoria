name: Fetch Academy art

# Academy pictures are made with CANVA (owner's rule; never Higgsfield). The Claude session lists the signed,
# short-lived export URLs in scripts/academy-art-request.json; this bot downloads them to public/academy-art/ and commits.
# Academy-only: the Playground has its own workflow (canva-art.yml).
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/academy-art-request.json'

permissions:
  contents: write

concurrency:
  group: academy-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and save
        run: |
          pip install --quiet pillow
          python scripts/fetch-academy-art.py 2>&1 | tee academy-art-last-run.txt
      - name: Commit art
        if: always()
        run: |
          git add public/academy-art
          if git diff --cached --quiet; then echo "No new art."; exit 0; fi
          git config user.name "academy-art-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Academy art ($(git diff --cached --name-only | wc -l) files)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
