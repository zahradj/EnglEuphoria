name: Voice sound-level audit

# Listens to every baked clip with a phoneme recogniser and compares the sounds
# with the dictionary pronunciation (scripts/voice-phoneme-audit.py). Writes
# docs/voice-audit/phonemes.json to the branch it ran on. Triggered by pushing
# scripts/voice-phoneme-audit-run.txt.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/voice-phoneme-audit-run.txt'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers phonemizer numpy
      - name: Manifest
        run: npx -y tsx scripts/generate-voice-cache.mjs --manifest=docs/voice-audit/manifest.json
      - name: Listen
        run: python scripts/voice-phoneme-audit.py
      - name: Commit report
        run: |
          git add docs/voice-audit/phonemes.json docs/voice-audit/manifest.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "voice-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Voice sound-level audit report"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
